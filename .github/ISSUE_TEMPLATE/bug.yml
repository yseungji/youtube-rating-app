name: 오류 제보
description: 재현 방법과 기대한 동작을 기록합니다.
title: "[오류] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. ... 화면으로 이동
        2. ... 버튼 클릭
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작과 기대한 동작
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경과 참고 자료
      description: Android 버전·기기·관련 로그·화면을 적어주세요. 로그에 토큰이나 개인정보가 들어가지 않게 확인해주세요.
